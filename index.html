export default function OscillatingMouseField() {
  return (
    <div className="w-full h-screen bg-black overflow-hidden relative">
      <canvas id="oscCanvas" className="absolute inset-0 w-full h-full" />

      <div className="absolute top-6 left-1/2 -translate-x-1/2 z-10">
        <div className="backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl px-6 py-4 shadow-2xl">
          <h1 className="text-white text-2xl md:text-4xl font-bold tracking-tight text-center">
            Oscillating Neural Field
          </h1>
          <p className="text-white/60 text-sm md:text-base text-center mt-2">
            Move your mouse and disturb the waves.
          </p>
        </div>
      </div>

      <Script />
    </div>
  )
}

function Script() {
  if (typeof window !== 'undefined') {
    setTimeout(() => {
      const existing = window.__oscillatingFieldInitialized
      if (existing) return
      window.__oscillatingFieldInitialized = true

      const canvas = document.getElementById('oscCanvas')
      const ctx = canvas.getContext('2d')

      let width = canvas.width = window.innerWidth
      let height = canvas.height = window.innerHeight

      const mouse = {
        x: width / 2,
        y: height / 2,
        radius: 180,
        velocityX: 0,
        velocityY: 0,
      }

      const particles = []
      const particleCount = Math.floor((width * height) / 14000)

      class Particle {
        constructor() {
          this.reset()
          this.baseX = this.x
          this.baseY = this.y
          this.size = Math.random() * 2 + 1
          this.phase = Math.random() * Math.PI * 2
          this.speed = Math.random() * 0.008 + 0.002
          this.offset = Math.random() * 120
        }

        reset() {
          this.x = Math.random() * width
          this.y = Math.random() * height
        }

        update(time) {
          const dx = this.x - mouse.x
          const dy = this.y - mouse.y
          const dist = Math.sqrt(dx * dx + dy * dy)

          const angle = Math.atan2(dy, dx)
          const force = Math.max(0, (mouse.radius - dist) / mouse.radius)

          const waveX = Math.sin(time * this.speed + this.phase + this.y * 0.008) * 35
          const waveY = Math.cos(time * this.speed + this.phase + this.x * 0.008) * 35

          const mouseInfluenceX = Math.cos(angle) * force * 100
          const mouseInfluenceY = Math.sin(angle) * force * 100

          this.x += (this.baseX + waveX + mouseInfluenceX - this.x) * 0.04
          this.y += (this.baseY + waveY + mouseInfluenceY - this.y) * 0.04
        }

        draw(time) {
          const hue = (
            (time * 0.02) +
            this.x * 0.08 +
            this.y * 0.05 +
            Math.sin(this.phase + time * 0.001) * 80
          ) % 360

          ctx.beginPath()
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2)

          ctx.fillStyle = `hsla(${hue}, 100%, 70%, 0.9)`
          ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.8)`
          ctx.shadowBlur = 15
          ctx.fill()
        }
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle())
      }

      function drawConnections(time) {
        for (let a = 0; a < particles.length; a++) {
          for (let b = a + 1; b < particles.length; b++) {
            const p1 = particles[a]
            const p2 = particles[b]

            const dx = p1.x - p2.x
            const dy = p1.y - p2.y
            const dist = Math.sqrt(dx * dx + dy * dy)

            if (dist < 110) {
              const opacity = 1 - dist / 110
              const hue = ((time * 0.015) + dist * 1.5) % 360

              ctx.beginPath()
              ctx.moveTo(p1.x, p1.y)
              ctx.lineTo(p2.x, p2.y)

              ctx.strokeStyle = `hsla(${hue}, 100%, 65%, ${opacity * 0.18})`
              ctx.lineWidth = 1
              ctx.stroke()
            }
          }
        }
      }

      function animate(time) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)'
        ctx.fillRect(0, 0, width, height)

        drawConnections(time)

        particles.forEach((particle) => {
          particle.update(time)
          particle.draw(time)
        })

        requestAnimationFrame(animate)
      }

      animate(0)

      window.addEventListener('mousemove', (e) => {
        mouse.velocityX = e.clientX - mouse.x
        mouse.velocityY = e.clientY - mouse.y

        mouse.x = e.clientX
        mouse.y = e.clientY
      })

      window.addEventListener('touchmove', (e) => {
        const touch = e.touches[0]
        mouse.x = touch.clientX
        mouse.y = touch.clientY
      })

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth
        height = canvas.height = window.innerHeight

        particles.length = 0

        const newCount = Math.floor((width * height) / 14000)

        for (let i = 0; i < newCount; i++) {
          particles.push(new Particle())
        }
      })
    }, 0)
  }

  return null
}
