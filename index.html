<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Oscillating Field</title>

<style>
  html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:black;
  }

  canvas{
    position:fixed;
    inset:0;
  }

  .title{
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-family:Arial;
    font-size:20px;
    opacity:0.7;
    z-index:10;
  }
</style>
</head>

<body>

<div class="title">Move mouse — fluid inertial field</div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

const mouse = {
  x: w/2,
  y: h/2,
  vx: 0,
  vy: 0
};

let particles = [];
const COUNT = Math.floor((w*h)/12000);

class P {
  constructor(){
    this.x = Math.random()*w;
    this.y = Math.random()*h;
    this.baseX = this.x;
    this.baseY = this.y;

    this.vx = 0;
    this.vy = 0;

    this.size = Math.random()*2+1;
    this.phase = Math.random()*Math.PI*2;
    this.speed = Math.random()*0.01 + 0.003;
  }

  update(t){

    // direction to mouse
    let dx = mouse.x - this.x;
    let dy = mouse.y - this.y;
    let dist = Math.sqrt(dx*dx + dy*dy) || 1;

    let nx = dx / dist;
    let ny = dy / dist;

    // soft attraction (not snap)
    let attract = Math.min(1, 150 / dist);

    // wave motion
    let waveX = Math.sin(t*this.speed + this.phase + this.y*0.01)*20;
    let waveY = Math.cos(t*this.speed + this.phase + this.x*0.01)*20;

    // ✨ key part: "wind from mouse movement"
    this.vx += nx * attract * 0.4;
    this.vy += ny * attract * 0.4;

    // slight drag toward base wave field
    this.vx += (this.baseX + waveX - this.x) * 0.01;
    this.vy += (this.baseY + waveY - this.y) * 0.01;

    // damping (deceleration to zero)
    this.vx *= 0.90;
    this.vy *= 0.90;

    this.x += this.vx;
    this.y += this.vy;
  }

  draw(t){
    let hue = (t*0.02 + this.x*0.05 + this.y*0.05)%360;

    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);

    ctx.fillStyle = `hsla(${hue},100%,70%,0.9)`;
    ctx.shadowColor = `hsla(${hue},100%,70%,0.8)`;
    ctx.shadowBlur = 12;

    ctx.fill();
  }
}

function init(){
  particles = [];
  for(let i=0;i<COUNT;i++) particles.push(new P());
}
init();

function drawLines(t){
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){

      let a = particles[i];
      let b = particles[j];

      let dx = a.x-b.x;
      let dy = a.y-b.y;
      let d = Math.sqrt(dx*dx+dy*dy);

      if(d < 100){
        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);

        ctx.strokeStyle = `hsla(${(t*0.02+d)%360},100%,60%,${1-d/100})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }
}

function animate(t){

  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,w,h);

  drawLines(t);

  for(let p of particles){
    p.update(t);
    p.draw(t);
  }

  requestAnimationFrame(animate);
}

animate(0);

window.addEventListener("mousemove",(e)=>{
  mouse.vx = e.clientX - mouse.x;
  mouse.vy = e.clientY - mouse.y;

  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

window.addEventListener("resize",()=>{
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  init();
});
</script>

</body>
</html>
