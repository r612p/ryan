<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Ryan's Website</title>


</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<canvas id="canvas"></canvas>

<section class="hero">

  <div class="small">Ryan Pham</div>

  <div class="image-placeholder">
    IMAGE PLACEHOLDER
  </div>

  <h1>
    Hi<br>
    <span class="gradient">    </span>  <!--THE COLOR TEXT IS HERE-->
  </h1>
</section>

<!-- WATERMARK -->
<div class="watermark">
  <span class="wm-title">Activate Windows</span><br>
  <span class="wm-sub">Go to Settings to activate Windows.</span>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

const mouse = {
  x: width / 2,
  y: height / 2,
  radius: 220
};

let particles = [];

const PARTICLE_COUNT =
  Math.floor((width * height) / 12000);

class Particle {

  constructor() {

    this.baseX = Math.random() * width;
    this.baseY = Math.random() * height;

    this.x = this.baseX;
    this.y = this.baseY;

    this.size = Math.random() * 2 + 1;

    this.phase = Math.random() * Math.PI * 2;

    this.speed = Math.random() * 0.008 + 0.002;

  }

  update(time) {

    const dx = this.x - mouse.x;
    const dy = this.y - mouse.y;

    const dist = Math.sqrt(dx * dx + dy * dy);

    const angle = Math.atan2(dy, dx);

    const force = Math.max(0,(mouse.radius - dist)/mouse.radius);

    const waveX =
      Math.sin(time*this.speed + this.phase + this.y*0.008)*35;

    const waveY =
      Math.cos(time*this.speed + this.phase + this.x*0.008)*35;

    const mouseX = Math.cos(angle)*force*100;
    const mouseY = Math.sin(angle)*force*100;

    this.x += (this.baseX + waveX + mouseX - this.x)*0.04;
    this.y += (this.baseY + waveY + mouseY - this.y)*0.04;

  }

  draw(time){

    const hue =
      (time*0.02 + this.x*0.08 + this.y*0.05) % 360;

    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);

    ctx.fillStyle = `hsla(${hue},100%,70%,0.9)`;
    ctx.shadowColor = `hsla(${hue},100%,70%,0.8)`;
    ctx.shadowBlur = 15;

    ctx.fill();
  }
}

function init(){
  particles = [];
  for(let i=0;i<PARTICLE_COUNT;i++){
    particles.push(new Particle());
  }
}

init();

function drawConnections(time){

  for(let a=0;a<particles.length;a++){
    for(let b=a+1;b<particles.length;b++){

      let p1 = particles[a];
      let p2 = particles[b];

      let dx = p1.x-p2.x;
      let dy = p1.y-p2.y;

      let dist = Math.sqrt(dx*dx+dy*dy);

      if(dist < 110){

        ctx.beginPath();
        ctx.moveTo(p1.x,p1.y);
        ctx.lineTo(p2.x,p2.y);

        ctx.strokeStyle =
          `hsla(${(time*0.02+dist)%360},100%,60%,${1-dist/110})`;

        ctx.stroke();

      }
    }
  }
}

function animate(time){

  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,width,height);

  drawConnections(time);

  particles.forEach(p=>{
    p.update(time);
    p.draw(time);
  });

  requestAnimationFrame(animate);
}

animate(0);

window.addEventListener("mousemove",(e)=>{
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

window.addEventListener("resize",()=>{
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  init();
});

</script>

</body>
</html>
